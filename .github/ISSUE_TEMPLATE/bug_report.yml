name: Bug report
description: Something in this marketplace or its plugins isn't working as documented.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. If this is a security vulnerability, please
        do not use this form — see [SECURITY.md](../../SECURITY.md) for how to
        report it privately instead.

  - type: input
    id: plugin
    attributes:
      label: Which plugin or skill is involved?
      description: e.g. guidance-conventions / validate-marketplace
      placeholder: guidance-conventions / validate-marketplace
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: What actually happened?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Include relevant file contents (e.g. your marketplace.json, plugin.json, or marketplace-plugin-settings.yml) if applicable.
      placeholder: |
        1. Install guidance-conventions
        2. Run validate-marketplace on ...
        3. See ...
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Anything else?
      description: Claude Code version, links to relevant docs, etc.
    validations:
      required: false
